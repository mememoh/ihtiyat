<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حصص الاحتياط</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{—bg:#f4f6f5;—card:#fff;—ink:#1c2a24;—mut:#6b7a73;—line:#e3e9e6;—g:#1f6b4f;—sub:#f1e9fb;—per:#e5eefc;—or:#e8832a;—ok:#e8f3ec}
@media (prefers-color-scheme:dark){:root{—bg:#121816;—card:#1b2420;—ink:#e8efeb;—mut:#92a39a;—line:#2b3832;—g:#5fc09a;—sub:#2a2236;—per:#1e2b44;—or:#e8933f;—ok:#1f3328}}
*{box-sizing:border-box}
body{margin:0;background:var(—bg);color:var(—ink);font-family:Tahoma,Arial,sans-serif;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.card{background:var(—card);border:1px solid var(—line);border-radius:16px;padding:14px;margin-bottom:10px}
h1{margin:0 0 10px;font-size:20px;color:var(—g)}
label{font-size:13px;color:var(—mut);display:block;margin-bottom:3px}
input,select,textarea{font:inherit;color:var(—ink);background:var(—bg);border:1px solid var(—line);border-radius:10px;padding:9px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(—line);background:var(—card);color:var(—ink);border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.pri{background:var(—g);color:var(—card);border-color:var(—g)}
.item{display:grid;grid-template-columns:44px 1fr;gap:10px;border-top:3px solid var(—or);padding:10px 0}
.item:first-child{border-top:none}
.per{background:var(—per);border-radius:10px;text-align:center;font-weight:700;font-size:20px;padding:8px 0;align-self:start}
.line{margin:2px 0}.mut{color:var(—mut);font-size:14px}
.mine{background:var(—ok);border-radius:12px;padding:8px}
.sigimg{height:40px;background:#fff;border-radius:8px;margin-top:6px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.acts select{flex:1}
dialog{border:none;border-radius:18px;padding:14px;background:var(—card);color:var(—ink);width:min(92vw,460px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
canvas{width:100%;height:200px;border:1px dashed var(—mut);border-radius:12px;background:#fff;touch-action:none;display:block}
.dl{display:flex;gap:8px;margin-top:10px}.dl .btn{flex:1}
.hide{display:none}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card noprint">
    <h1>حصص الاحتياط</h1>
    <div class="row2">
      <div><label>التاريخ</label><input type="date" id="day"></div>
      <div id="whoBox"><label>اسمك</label><select id="who"></select></div>
    </div>
  </div>
  <div id="err" class="card hide"></div>

  <div id="admin" class="card hide noprint">
    <b>إدارة الجدول</b>
    <div class="row2" style="margin-top:8px">
      <div><label>الحصة</label><select id="aPer"></select></div>
      <div><label>الصف</label><input id="aCls" placeholder="3/1"></div>
      <div><label>الغائبة</label><input id="aAbs"></div>
      <div><label>المادة</label>
